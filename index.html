<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restoration Game — iPad prototype</title>
<style>
:root{--bg:#f7f4eb;--ink:#19263c;--muted:#4a5563;--teal:#28666e;--gold:#f2c14e;--surface:white;--border:#657382;--selected:#e7f2f2;--good:#205c42;--retry:#735010}
*{box-sizing:border-box}body{margin:0;background:#e6e9eb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.4}button,input{font:inherit}button{min-height:64px;padding:14px 24px;border:2px solid var(--ink);border-radius:14px;background:white;color:var(--ink);font-size:23px;font-weight:650;cursor:pointer}button:hover{box-shadow:0 0 0 3px #28666e33}button:focus-visible,input:focus-visible{outline:4px solid var(--teal);outline-offset:4px}button:disabled{cursor:default;background:#dee2e6;color:var(--muted);box-shadow:none}button.primary{background:var(--ink);color:white}button.gold{background:var(--gold)}.review{max-width:1080px;margin:20px auto 16px;padding:0 12px;font-size:15px}.review strong{display:block;font-size:19px;margin-bottom:4px}.review a{color:var(--teal)}.app{width:min(1080px,calc(100% - 32px));min-height:768px;margin:0 auto 28px;background:var(--bg);border-radius:24px;box-shadow:0 12px 44px #19263c18;padding:32px;display:flex;flex-direction:column;gap:20px}.top{display:flex;gap:20px;justify-content:space-between;align-items:center;color:var(--muted);font-size:19px}.stage{font-weight:650}.pause{font-size:19px;min-height:52px;padding:8px 20px}.progress{width:100%;height:8px;border-radius:10px;background:#dee2e6}.progress span{display:block;background:var(--teal);height:100%;border-radius:10px}.heading h1{font-size:35px;line-height:1.2;margin:0 0 8px;letter-spacing:-.5px}.heading p{margin:0;font-size:24px;color:var(--muted)}.task{flex:1;display:flex;flex-direction:column;gap:16px;font-size:24px}.footer{margin-top:12px;display:flex;gap:24px;justify-content:space-between;align-items:center}.footer p{font-size:19px;color:var(--muted);margin:0;max-width:600px}.footer button{min-width:280px}.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:36px;align-items:center;margin:8px 0 18px}.hero h2{font-size:51px;letter-spacing:-1px;line-height:1.12;margin:0 0 20px}.hero p{font-size:24px;margin:0 0 24px}.hero svg{width:100%;max-height:330px}.card{background:white;border:2px solid var(--border);padding:24px;border-radius:18px}.card h2{font-size:28px;margin:0 0 12px;line-height:1.2}.card p{margin:0}.note{font-size:19px;color:var(--muted)}.choices{display:grid;gap:14px}.choice{width:100%;display:flex;align-items:center;gap:20px;text-align:left;min-height:72px;border-color:var(--border);font-weight:600}.choice .marker{width:36px;flex-shrink:0;text-align:center}.choice.selected{background:var(--selected);border-color:var(--teal)}.choice .status{margin-left:auto;font-size:19px;white-space:nowrap;color:var(--teal)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}.pleas{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.plea{text-align:left;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}.plea small{font-size:19px;color:var(--teal);display:block;margin-top:12px}.court{height:375px;position:relative;border-radius:22px;overflow:hidden}.court svg{width:100%;height:100%;display:block}.court button{position:absolute;background:transparent;border:none;padding:0;min-height:0}.court button:hover,.court button:focus-visible{outline:4px solid var(--teal);outline-offset:-4px;background:#ffffff33;border-radius:14px}.court .judge{left:42%;top:6%;width:16%;height:56%}.court .bailiff{left:15%;top:37%;width:13%;height:50%}.court .lawyer{left:72%;top:37%;width:13%;height:50%}.court .defendant{left:46%;top:70%;width:13%;height:30%}.pin{max-width:400px;margin:0 auto;width:100%;text-align:center}.pin input{width:100%;font-size:36px;letter-spacing:14px;text-align:center;padding:12px;border:2px solid var(--ink);border-radius:12px;margin:10px 0 20px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.keypad button{min-height:72px}.score{font-size:52px;font-weight:750;display:block}.table{border-collapse:collapse;width:100%;font-size:21px}.table th,.table td{text-align:left;padding:15px 12px;border-bottom:1px solid #ccd2d5}.table th{background:#e7f2f2}.tablewrap{overflow:auto}.empty{padding:44px;text-align:center}.tag{color:var(--teal);font-size:18px;font-weight:600}dialog{border:2px solid var(--ink);border-radius:24px;padding:32px;max-width:650px;width:calc(100% - 40px);color:var(--ink);background:white}dialog::backdrop{background:#19263c80}dialog h2{font-size:31px;line-height:1.2;margin:0 0 18px}dialog p{font-size:24px;margin:0 0 28px}dialog button{width:100%}.good{color:var(--good)}.retry{color:var(--retry)}.actions{display:flex;gap:16px;flex-wrap:wrap}.actions button{flex:1}.printonly{display:none}
@media(min-width:1000px){.app{height:810px}.task{overflow:auto;min-height:0;padding:3px 4px 8px}.hero{min-height:330px}.court{flex-shrink:0}}@media(max-width:850px){.app{padding:24px;min-height:900px;border-radius:16px}.hero,.grid2{grid-template-columns:1fr}.hero svg{max-height:220px}.hero h2{font-size:40px}.pleas{grid-template-columns:1fr 1fr}.footer{align-items:stretch;flex-direction:column}.footer button{width:100%}.heading h1{font-size:30px}.court{height:300px}.top{font-size:17px}.choice{flex-wrap:wrap}.choice .status{margin-left:56px}.task{font-size:23px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}@media print{.review,.pause,.footer,dialog{display:none}.app{height:auto;box-shadow:none;margin:0;width:100%;border-radius:0}.task{overflow:visible}}
</style></head><body>
<div class="review"><strong>COMP 523 · Restoration Game UI review</strong>Design prototype with sample content. Workbook answers, evidence ratings, plea explanations, sentencing terms, and score policy require client review. Staff demo PIN: <b>1234</b>. <a href="https://www.figma.com/design/LqpNZ8xzXNIztqXSIhGzqN">Editable Figma draft</a>.</div>
<div class="review"><label for="screenJump">Reviewer controls · Preview a screen: </label><select id="screenJump" style="font:inherit;padding:8px;border:1px solid #9ca6ae;border-radius:8px"><option value="home">Home</option><option value="judge">Courtroom</option><option value="hearing">Hearing question</option><option value="rights">Rights question</option><option value="role">Attorney question</option><option value="evidence0">Evidence</option><option value="pleas">Plea lessons</option><option value="offer">Plea offer</option><option value="decision">Plea decision</option><option value="pin">Staff access</option></select></div>
<main class="app" id="app" aria-label="Restoration Game"></main>
<dialog id="feedback" aria-labelledby="feedbackTitle"><h2 id="feedbackTitle"></h2><p id="feedbackText"></p><button class="primary" id="feedbackAction"></button></dialog>
<script>
const app=document.getElementById('app'),dlg=document.getElementById('feedback');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stages=['Courtroom','Hearing and rights','Attorney','Evidence','Pleas','Offer and outcome'];
let state={screen:'home',selected:[],records:{},pleas:[],pin:'',saved:false}, afterFeedback=null;
try{const saved=JSON.parse(localStorage.getItem('restoration-ui-demo'));if(saved&&saved.screen){state={...state,...saved,screen:'home',saved:true};}}catch{}
let resumeScreen='intro';try{resumeScreen=localStorage.getItem('restoration-ui-resume')||'intro';}catch{}
function save(){if(!['home','pin','results'].includes(state.screen)){state.saved=true;resumeScreen=state.screen;try{localStorage.setItem('restoration-ui-demo',JSON.stringify({...state,pin:''}));localStorage.setItem('restoration-ui-resume',state.screen);}catch{}}}
function go(screen){state.screen=screen;state.selected=[];save();render();document.getElementById('title')?.focus();}
function popup(title,message,action,fn,good=false){document.getElementById('feedbackTitle').textContent=title;document.getElementById('feedbackTitle').className=good?'good':'retry';document.getElementById('feedbackText').textContent=message;document.getElementById('feedbackAction').textContent=action;afterFeedback=fn;dlg.showModal();document.getElementById('feedbackAction').focus();}
document.getElementById('feedbackAction').onclick=()=>{dlg.close();if(afterFeedback)afterFeedback();};
function record(id,right){let r=state.records[id];if(!r)r=state.records[id]={attempts:0,firstCorrect:false,completed:false};r.attempts++;if(r.attempts===1)r.firstCorrect=right;if(right)r.completed=true;save();}
function check(id,right,next,message){record(id,right);if(right)popup('✓ That’s right.',message,'Continue',()=>go(next),true);else popup('! Not quite. Try again.',message,'Try again',()=>{state.selected=[];render();document.getElementById('title')?.focus();});}
function btn(label,action,cls='',disabled=false){return `<button class="${cls}" data-action="${esc(action)}" ${disabled?'disabled':''}>${esc(label)}</button>`;}
function card(title,text){return `<section class="card"><h2>${esc(title)}</h2><p>${esc(text)}</p></section>`;}
const courtSvg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="A courtroom with a person behind a central bench and three people around them"><rect width="960" height="380" rx="22" fill="#E8EEEE"/><path d="M0 270h960v110H0z" fill="#E3DBC5"/><rect x="330" y="32" width="300" height="185" rx="20" fill="#D5DDDB"/><circle cx="480" cy="75" r="30" fill="#BC855A"/><path d="M438 135a42 42 0 0 1 84 0v60h-84z" fill="#19263C"/><rect x="357" y="158" width="246" height="86" rx="10" fill="#8D7650"/><rect x="370" y="173" width="220" height="52" rx="8" fill="#69573D"/><circle cx="203" cy="182" r="26" fill="#D0A077"/><path d="M163 251a40 40 0 0 1 80 0v64h-80z" fill="#28666E"/><circle cx="757" cy="182" r="26" fill="#BC855A"/><path d="M717 251a40 40 0 0 1 80 0v64h-80z" fill="#756187"/><circle cx="503" cy="296" r="24" fill="#D0A077"/><path d="M464 365a39 39 0 0 1 78 0v15h-78z" fill="#AF791B"/></svg>`;
const temple=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" role="img" aria-label="An illustrated court building"><rect width="340" height="300" rx="36" fill="#E7F2F2"/><path d="M45 106L170 39l125 67z" fill="#28666E"/><rect x="53" y="115" width="234" height="17" rx="5" fill="#19263C"/><path d="M80 146v98m60-98v98m60-98v98m60-98v98" stroke="#19263C" stroke-width="23"/><rect x="53" y="255" width="234" height="16" rx="5" fill="#19263C"/></svg>`;
const pleaNames=['Not guilty','Guilty','No contest','Alford','NGRI'];
const quizzes={
 hearing:{title:'What is this hearing called?',options:['Bond hearing','Trial','Sentencing','Appeal'],correct:[0],next:'rights',stage:1,feedback:'The judge has read the charges and set bond. “Bond hearing” is the sample answer shown in the team presentation; confirm it with the client.'},
 rights:{title:'What rights does the defendant have?',options:['Workbook right A','Workbook right B','Workbook right C','Workbook right D'],correct:[0,2],multi:true,next:'attorney',stage:1,feedback:'This prototype uses sample rights A and C to show how a select-all question works. Replace the options and answer key with the approved workbook.'},
 role:{title:'What is the defense attorney’s role?',options:['Workbook answer A','Workbook answer B','Workbook answer C','Workbook answer D'],correct:[0],next:'evidence0',stage:2,feedback:'This is a sample answer key for the UI demonstration. The attorney’s role and distractors must come from approved content.'}
};
const evidence=[['Eyewitness account','A person says they saw someone near the bank.'],['Video footage','The client-approved video or illustrated sequence will appear here.'],['Weapon information','The client-approved information about the weapon will appear here.'],['The evidence as a whole','Think about the eyewitness account, the video, and the weapon information together.']];
function options(items,multi=false){return `<div class="choices" role="group" aria-label="Answer choices">${items.map((s,i)=>{let on=state.selected.includes(i);return `<button class="choice ${on?'selected':''}" data-choice="${i}" aria-pressed="${on}"><span class="marker" aria-hidden="true">${multi?(on?'☑':'☐'):String.fromCharCode(65+i)}</span><span>${esc(s)}</span>${on?'<span class="status">✓ Selected</span>':''}</button>`;}).join('')}</div>`;}
function render(){let s=state.screen,title='',sub='',body='',footer='',hint='Take your time.',stage=0,question=null;
 if(s==='home'){title='Restoration Game';sub='Learn how court works, one step at a time.';body=`<div class="hero"><div><h2>A story you can<br>learn from.</h2><p>Meet people in court, review evidence, and learn about pleas. You can try again whenever you need to.</p>${state.saved?btn('Continue saved game','resume'):''}</div>${temple}</div>`;footer=btn('Start a new game','new','gold')+btn('Hospital staff','staff');hint='A made-up story for learning.';}
 else if(s==='intro'){title='The story begins';sub='Follow a character through the court process.';body=card('Meet the defendant','The character has been arrested for robbing a bank. The story begins in a jail cell, then moves to a courtroom.')+'<p>This is a fictional story. You will help the character learn what happens next.</p>';footer=btn('Enter the courtroom','go:judge','primary');}
 else if(s==='judge'||s==='bailiff'){title=s==='judge'?'Who is the judge?':'Who is the bailiff?';sub='Tap the person in the picture.';body=`<div class="court">${courtSvg}<button class="judge" data-person="judge" aria-label="Person behind the central bench"></button><button class="bailiff" data-person="bailiff" aria-label="Person in teal at the left"></button><button class="lawyer" data-person="attorney" aria-label="Person in purple at the right"></button><button class="defendant" data-person="defendant" aria-label="Person in gold near the front"></button></div>`;hint='Choose a person to continue.';}
 else if(s==='charges'){title='Listen to the judge';sub='The judge reads the charges and sets bond.';stage=1;body=card('In the courtroom','The judge tells the defendant what they are charged with and sets bond.')+'<p class="note">Final dialogue needs client review.</p>';footer=btn('Answer a question','go:hearing','primary');}
 else if(quizzes[s]){question=quizzes[s];title=question.title;sub=question.multi?'Choose all answers that apply. Then tap Check answers.':'Choose one answer. Then tap Check answer.';stage=question.stage;body=options(question.options,question.multi);footer=btn(question.multi?'Check answers':'Check answer','submit','primary',!state.selected.length);hint=state.selected.length?'Ready to check your answer.':'Choose an answer to continue.';}
 else if(s==='attorney'){title='One week later';sub='The defendant meets their appointed attorney.';stage=2;body=card('Meet the defense attorney','The attorney introduces themselves and explains how they will work with the defendant.')+'<p class="note">Final dialogue needs client review.</p>';footer=btn('Answer a question','go:role','primary');}
 else if(s.startsWith('evidence')){let i=+s.slice(8);stage=3;title=evidence[i][0];sub=i<3?`Evidence ${i+1} of 3 · Read or watch, then choose.`:'Think about all three pieces of evidence.';body=card(title,evidence[i][1])+(i===1?btn('Preview video area','video'):'')+options(['Strong','Weak']);footer=btn('Check answer','evidenceCheck','primary',!state.selected.length);hint='Sample content and evidence ratings.';}
 else if(s==='pleas'){stage=4;title='Learn about each plea';sub='Finish each lesson and question before continuing.';body=`<div class="pleas">${pleaNames.map((p,i)=>`<button class="plea" data-action="go:plea${i}"><span>${esc(p)}</span><small>${state.pleas.includes(i)?'✓ Completed':'Tap to learn'}</small></button>`).join('')}</div>`;footer=btn('See the plea offer','go:offer','primary',state.pleas.length!==5);hint=state.pleas.length+' of 5 lessons complete';}
 else if(/^plea\d$/.test(s)){let i=+s.slice(4);stage=4;title=pleaNames[i];sub='Learn what this plea means for the character.';body=card('What this plea means','A short, plain-language explanation from the approved workbook belongs here.')+card('What can happen next','The client’s approved explanation of the possible outcome belongs here.');footer=btn('Answer a question','go:pleaQuiz'+i,'primary');hint='Lesson '+(i+1)+' of 5 · draft content';}
 else if(s.startsWith('pleaQuiz')){let i=+s.slice(8);stage=4;title='If I plead '+pleaNames[i].toLowerCase()+', what happens?';sub='Choose one answer. Then tap Check answer.';body=options(['Approved workbook outcome A','Approved workbook outcome B','Approved workbook outcome C','Approved workbook outcome D','Approved workbook outcome E']);footer=btn('Check answer','pleaCheck','primary',!state.selected.length);hint='Sample answers · not a legal answer key.';}
 else if(s==='offer'){stage=5;title='Think about the plea offer';sub='Compare the offer with what could happen at trial.';body='<div class="grid2">'+card('If the case goes to trial','The approved maximum sentence for this fictional case belongs here.')+card('The plea offer','The approved offer and its conditions belong here.')+'</div><p>Is this a fair offer?</p>'+options(['Yes','No']);footer=btn('Check answer','offerCheck','primary',!state.selected.length);hint='Draft scenario · terms need client approval.';}
 else if(s==='decision'){stage=5;title='What plea will the character enter?';sub='Choose a plea to see the next part of the story.';body=options(pleaNames);footer=btn('Choose this plea','decisionCheck','primary',!state.selected.length);hint='This is a story choice.';}
 else if(s.startsWith('outcome')){stage=5;let route=s.slice(7);title=route==='0'?'The character chose not guilty':route==='4'?'The character chose NGRI':'The character chose guilty, no contest, or Alford';sub='See what happens next in this fictional story.';body=card('The next part of the story','Client-approved outcome dialogue will appear here. The three routes match the proposed game flow.');footer=btn('Finish the story','go:done','primary');}
 else if(s==='done'){stage=5;title='You finished the story';sub='You practiced the court process, evidence, and pleas.';body=card('Keep learning','Talk with hospital staff about the parts you want to practice again.');footer=btn('Return home','go:home','primary');hint='Your practice session is complete.';}
 else if(s==='pin'){title='Hospital staff';sub='Enter your PIN to review results.';body=`<div class="pin"><label for="pininput" class="note">4-digit demo PIN</label><input id="pininput" type="password" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(state.pin)}" aria-label="Staff demo PIN"><div class="keypad">${['1','2','3','4','5','6','7','8','9','Cancel','0','Delete'].map(n=>btn(n,'pin:'+n)).join('')}</div></div>`;footer=btn('Unlock results','unlock','primary',state.pin.length!==4);hint='Demo access screen · no real authentication.';}
 else if(s==='results'){title='Session results';sub='Design demo data · no patient information';const rows=Object.entries(state.records),done=rows.filter(([,v])=>v.completed),first=done.filter(([,v])=>v.firstCorrect),score=done.length?Math.round(first.length/done.length*100):null;body=done.length?'<div class="grid2">'+card('First-try score',`${first.length} of ${done.length} completed checks · ${score}%`)+card('Follow-up topics','Review checks that needed more than one attempt.')+'</div><div class="tablewrap"><table class="table"><thead><tr><th scope="col">Topic</th><th scope="col">Attempts</th><th scope="col">Follow-up</th></tr></thead><tbody>'+rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.attempts}</td><td>${v.attempts>1?'! Review':'✓ First try'}</td></tr>`).join('')+'</tbody></table></div>':card('No completed checks yet','Play through a few questions to see sample session results.');footer=btn('Lock and return','lock','primary');hint='Proposed score uses completed checks only; confirm final policy.';}
 const isStaff=['pin','results'].includes(s);app.innerHTML=`<div class="top"><span class="stage">${s==='home'?'Practice at your own pace':isStaff?'Hospital staff':stages[stage]+' · Step '+(stage+1)+' of 6'}</span>${s!=='home'?btn(isStaff?'Return home':'Pause','pause','pause'):''}</div>${s!=='home'&&!isStaff?'<div class="progress" role="progressbar" aria-label="Story progress" aria-valuemin="0" aria-valuemax="6" aria-valuenow="'+(stage+1)+'"><span style="width:'+((stage+1)/6*100)+'%"></span></div>':''}<header class="heading"><h1 id="title" tabindex="-1">${esc(title)}</h1><p>${esc(sub)}</p></header><section class="task" aria-labelledby="title">${body}</section><footer class="footer">${s==='home'?'':'<p>'+esc(hint)+'</p>'}${footer}</footer>`;
 app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let i=+b.dataset.choice;if(question?.multi){state.selected=state.selected.includes(i)?state.selected.filter(v=>v!==i):[...state.selected,i];}else state.selected=[i];render();app.querySelector('[data-choice="'+i+'"]').focus();});
 app.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{const who=b.dataset.person,correct=who===state.screen;check('Identify the '+state.screen,correct,state.screen==='judge'?'bailiff':'charges',correct?'You identified the '+who+'.':'That is the '+who+'. Try again.');});
 app.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));
 document.getElementById('pininput')?.addEventListener('input',e=>{state.pin=e.target.value.replace(/\D/g,'').slice(0,4);document.querySelector('[data-action="unlock"]').disabled=state.pin.length!==4;});
}
function action(a){if(a.startsWith('go:'))return go(a.slice(3));if(a==='new'){const start=()=>{state={screen:'intro',selected:[],records:{},pleas:[],pin:'',saved:true};go('intro');};if(state.saved)popup('Start again?','This replaces the saved practice session in this prototype.','Start a new game',start);else start();}
 else if(a==='resume')go(resumeScreen);else if(a==='staff'){state.pin='';go('pin');}else if(a==='pause'){state.pin='';save();go('home');}
 else if(a==='submit'){const q=quizzes[state.screen],set=[...state.selected].sort();check(q.title,JSON.stringify(set)===JSON.stringify(q.correct),q.next,q.feedback);}
 else if(a==='evidenceCheck'){let i=+state.screen.slice(8);check(evidence[i][0],state.selected[0]===0,i<3?'evidence'+(i+1):'pleas','This UI demo uses Strong as its sample answer. The client must supply the evidence facts, ratings, and explanation.');}
 else if(a==='video')popup('Video preview area','The client-approved clip, playback controls, and captions will be placed here. No clip was supplied for this scenario.','Return to evidence',null,true);
 else if(a==='pleaCheck'){let i=+state.screen.slice(8),right=state.selected[0]===0;record('Plea: '+pleaNames[i],right);if(right){if(!state.pleas.includes(i))state.pleas.push(i);save();popup('✓ Lesson complete.','This is sample outcome A. Replace the text and answer key with the approved workbook.','Back to pleas',()=>go('pleas'),true);}else popup('! Not quite. Try again.','For this design demonstration, choose sample outcome A. The real answer key needs client review.','Try again',()=>{state.selected=[];render();});}
 else if(a==='offerCheck')check('Plea offer fairness',state.selected[0]===0,'decision','This prototype uses Yes as a sample answer. The client must approve the scenario, fairness key, and explanation.');
 else if(a==='decisionCheck'){let p=state.selected[0];popup('Choose '+pleaNames[p]+'?','This choice changes what happens next to the fictional character.','Confirm this plea',()=>go('outcome'+(p===0?0:p===4?4:1)),true);}
 else if(a.startsWith('pin:')){let n=a.slice(4);if(n==='Cancel')return go('home');state.pin=n==='Delete'?state.pin.slice(0,-1):(state.pin+n).slice(0,4);render();}
 else if(a==='unlock'){if(state.pin==='1234')go('results');else popup('PIN not recognized.','Try the demo PIN 1234. Real staff access will be implemented by the team.','Try again',()=>{state.pin='';render();});}
 else if(a==='lock'){state.pin='';go('home');}}
document.getElementById('screenJump').addEventListener('change',e=>{state.pin='';go(e.target.value);});
render();
</script></body></html>
